
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALERTA</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: piscar 0.5s infinite;
        }

        h1 {
            color: white;
            font-size: 150px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-shadow: 5px 5px 10px black;
        }

        @keyframes piscar {
            0% {
                background-color: blue;
            }

            50% {
                background-color: red;
            }

            100% {
                background-color: blue;
            }
        }
    </style>
</head>

<body>

    <h1>CADE O GERENTE</h1>

</body>
</html>
